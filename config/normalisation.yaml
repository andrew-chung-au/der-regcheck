default:
  min_text_length: 3
  retain_raw_text: true
  remove_exact_duplicates: true

sources:
  cpuc_rule21_overview:
    drop_heading_paths:
      - "Electric Rule 21: Generating Facility Interconnections > Table of Contents:"

  sce_interconnection_web:
    drop_heading_paths: []
    drop_exact_text: []

  sce_interconnection_handbook_pdf:
    skip_pdf_pages:
      - 1
      - 2
      - 3
      - 187
    repeated_line_patterns:
      - "^This document is controlled by the originating SCE T&D organization.*$"
      - "^When downloaded and printed, this document.*UNCONTROLLED.*$"
      - "^and users should check with the originator.*latest version.*$"
      - "^This applies to the remainder of the document.*$"
      - "^System Planning & Engineering$"
      - "^Document No\\. 1$"
      - "^Version No\\. 16$"
      - "^INTERCONNECTION HANDBOOK Effective Date.*$"
      - "^Docusign Envelope ID:.*$"
      - "^Requirement \\| Page .+$"
    part_patterns:
      - "^PART\\s+(\\d+)$"
    section_patterns:
      - "^SECTION\\s+(\\d+)\\s+(.+)$"
    clause_patterns:
      - "^(\\d+(?:\\.\\d+){1,4})\\s+(.+)$"

  sce_rule21_tariff_pdf:
    skip_pdf_pages: []
    repeated_line_patterns: []
    part_patterns: []
    section_patterns: []
    clause_patterns:
      - "^(\\d+(?:\\.\\d+){1,4})\\s+(.+)$"

  sce_testing_certification_instruction_pdf:
    skip_pdf_pages:
      - 1
      - 2
    repeated_line_patterns:
      - "^Instruction Sheet - Version 6/5/2025(?: Page \\d+)?$"
    part_patterns: []
    section_patterns:
      - "^Section\\s+(\\d+(?:\\.\\d+)*)\\.\\s+(.+)$"
    clause_patterns:
      - "^(\\d+(?:\\.\\d+){1,4})\\s+(.+)$"

  siwg_phase2_recommendations_pdf:
    skip_pdf_pages:
      - 1
      - 2
    repeated_line_patterns: []
    part_patterns: []
    section_patterns: []
    clause_patterns:
      - "^(\\d+(?:\\.\\d+){1,4})\\s+(.+)$"
