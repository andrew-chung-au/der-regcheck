services:
  db:
    image: pgvector/pgvector:pg16
    container_name: der-regcheck-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-der-regcheck}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - der_regcheck_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-postgres}",
          "-d",
          "${POSTGRES_DB:-der-regcheck}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: der-regcheck-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # PostgreSQL
      POSTGRES_DB: ${POSTGRES_DB:-der-regcheck}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-der-regcheck}
      # Google AI (Gemini)
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      MODEL_ID: ${MODEL_ID:-gemini-3.5-flash-lite}
      # Streamlit
      STREAMLIT_PORT: ${STREAMLIT_PORT:-8501}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    # Optional: mount .env at runtime if you prefer
    # env_file:
    #   - .env

volumes:
  der_regcheck_db_data: